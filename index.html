<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Phiếu đặt món 12A7</title>

<style>
body{
  background:#f3dede;
  font-family: Arial;
}

.box{
  background:white;
  max-width:900px;
  margin:40px auto;
  padding:30px;
  border-radius:16px;
  box-shadow:0 0 20px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  color:#c40000;
}

input[type=text], input[type=number]{
  width:100%;
  padding:8px;
  font-size:16px;
  margin-top:6px;
}

.item{
  display:flex;
  align-items:center;
  gap:20px;
  margin:20px 0;
}

.item img{
  width:520px;
  border-radius:10px;
  border:3px solid #c40000;
}

button{
  width:100%;
  padding:14px;
  font-size:18px;
  background:#d60000;
  color:white;
  border:none;
  border-radius:12px;
  cursor:pointer;
}

button:hover{
  background:#a80000;
}
</style>
</head>

<body>

<div class="box">

<h2>Phiếu đặt món 12A7</h2>

Tên học sinh:
<input id="name">

<br><br>

Lớp:
<input id="class">

<div class="item">
  <img src="tratac.jpg">
  <div>
    <label>
      <input type="checkbox" id="ck1"> Trà tắc trân châu
    </label>
    <br>
    SL:
    <input type="number" id="q1" value="0" min="0">
  </div>
</div>

<div class="item">
  <img src="hacap.jpg">
  <div>
    <label>
      <input type="checkbox" id="ck2"> Há cảo
    </label>
    <br>
    SL:
    <input type="number" id="q2" value="0" min="0">
  </div>
</div>

<p>Há cảo 1 phần gồm 8 viên</p>
<p>*Lưu ý: nếu gửi lỗi, kiểm tra lại thông tin và bấm gửi lại</p>

<h3>Tổng đơn: <span id="total">0</span></h3>
<h3>Tổng tiền: <span id="money">0</span> đ</h3>

<button onclick="submitForm()">Gửi đơn</button>

</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
emailjs.init("d9zrr1HVpWyHnALoY");

const ck1 = document.getElementById("ck1");
const ck2 = document.getElementById("ck2");
const q1 = document.getElementById("q1");
const q2 = document.getElementById("q2");

function updateTotal(){
  let total = 0;

  if(ck1.checked) total += parseInt(q1.value)||0;
  if(ck2.checked) total += parseInt(q2.value)||0;

  document.getElementById("total").innerText = total;
  document.getElementById("money").innerText = total*15000;
}

ck1.onchange = updateTotal;
ck2.onchange = updateTotal;
q1.oninput = updateTotal;
q2.oninput = updateTotal;

function submitForm(){

let name = document.getElementById("name").value.trim();
let cls = document.getElementById("class").value.trim();

if(name=="" || cls==""){
  alert("Nhập tên và lớp");
  return;
}

let orderText = "";
let total = 0;

if(ck1.checked){
  let n = parseInt(q1.value)||0;
  if(n>0){
    orderText += "Trà tắc trân châu: " + n + "\n";
    total += n;
  }
}

if(ck2.checked){
  let n = parseInt(q2.value)||0;
  if(n>0){
    orderText += "Há cảo: " + n + "\n";
    total += n;
  }
}

if(total==0){
  alert("Chưa chọn sản phẩm");
  return;
}

emailjs.send(
  "service_y64v9t4",
  "template_45dmsdv",
  {
    name: name,
    class: cls,
    items: orderText,
    oder_total: total,
    money: total*15000
  }
).then(
  function(){
    alert("Đã gửi đơn về Gmail!");
  },
  function(err){
    alert("Gửi lỗi: " + err.text);
  }
);

}
</script>

</body>
</html>
